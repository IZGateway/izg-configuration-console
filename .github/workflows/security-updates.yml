name: Security Updates

on:
  schedule:
    # Run daily at 3 AM UTC (avoids conflict with E2E tests at 7 AM)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dependency_scripts_channel:
        description: 'npm tag for @izgateway/dependency-scripts (use "dev" to test pre-release changes)'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest
          - dev

permissions:
  contents: read
  packages: read

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate Dependency Bot App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: develop
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@izgateway'
      
      - name: Configure Git
        run: |
          git config user.name "izg-dependency-bot[bot]"
          git config user.email "321530222+izg-dependency-bot[bot]@users.noreply.github.com"
      
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Configuring npm authentication for GitHub Packages..."
          # Configure npm using npm config set commands
          npm config set @izgateway:registry https://npm.pkg.github.com/
          npm config set //npm.pkg.github.com/:_authToken ${NPM_TOKEN}
          echo "✓ npm authentication configured"
          # Verify configuration without exposing secrets
          if [ -n "$NPM_TOKEN" ]; then
            echo "✓ NPM_TOKEN is set"
          else
            echo "✗ ERROR: NPM_TOKEN is not set"
            exit 1
          fi
          # Verify registry configuration
          REGISTRY=$(npm config get @izgateway:registry)
          if [ "$REGISTRY" = "https://npm.pkg.github.com/" ]; then
            echo "✓ Registry configured correctly"
          else
            echo "✗ ERROR: Registry not configured correctly"
            exit 1
          fi
      
      - name: Install dependencies
        run: |
          npm ci
          npm audit fix || true

      - name: Install security tooling
        run: |
          npm install -g npm-check-updates
          SCRIPTS_CHANNEL="${{ inputs.dependency_scripts_channel || 'latest' }}"
          npm install --no-save @izgateway/dependency-scripts@${SCRIPTS_CHANNEL}
          npm audit fix || true
          DS_VERSION=$(node -p 'require("./node_modules/@izgateway/dependency-scripts/package.json").version')
          echo "Using @izgateway/dependency-scripts@${DS_VERSION}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run ncu and check for updates
        id: ncu_check
        run: |
          echo "Running npm-check-updates with --target minor..."
          # Exclude @typescript-eslint/* sub-packages from ncu. These are part of the
          # typescript-eslint meta-package and must stay in sync with the version that
          # eslint-config-next resolves transitively. ncu bumps them independently,
          # which races ahead of the meta-package release and causes ERESOLVE.
          # fix-all-vulnerabilities.js handles these when there is an actual vulnerability.
          ncu --target minor --reject "@typescript-eslint/*" -u > ncu_output.txt 2>&1 || true
          cat ncu_output.txt
          
          if git diff --quiet package.json; then
            echo "has_ncu_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No minor dependency updates available"
          else
            echo "has_ncu_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Minor dependency updates found"
          fi
      
      - name: Update existing overrides
        id: override_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating packages in overrides section..."
          node node_modules/@izgateway/dependency-scripts/update-overrides.js
          
          if git diff --quiet package.json; then
            echo "has_override_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No override updates needed"
          else
            echo "has_override_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Override updates found"
          fi
      
      - name: Fix all vulnerabilities
        id: security_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fixing all security vulnerabilities (updates direct deps + adds overrides)..."
          node node_modules/@izgateway/dependency-scripts/fix-all-vulnerabilities.js
          
          if git diff --quiet package.json; then
            echo "has_security_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No security fixes needed"
          else
            echo "has_security_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Security fixes applied"
          fi
      
      - name: Check if any changes were made
        id: final_check
        run: |
          if [[ "${{ steps.ncu_check.outputs.has_ncu_changes }}" == "true" || \
                "${{ steps.override_check.outputs.has_override_changes }}" == "true" || \
                "${{ steps.security_check.outputs.has_security_changes }}" == "true" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected, proceeding with PR creation"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No changes detected"
          fi
      
      - name: Stop if no changes
        if: steps.final_check.outputs.has_changes == 'false'
        run: |
          echo "## No Dependency Updates Available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All dependencies and overrides are up-to-date." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next check:** Next scheduled run or manual trigger" >> $GITHUB_STEP_SUMMARY
          exit 0
      
      - name: Create update branch
        if: steps.final_check.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="automated-security-updates-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "✓ Created branch: $BRANCH_NAME"
      
      - name: Test override removal
        if: steps.final_check.outputs.has_changes == 'true'
        run: |
          echo "Testing if overrides can be removed..."
          node node_modules/@izgateway/dependency-scripts/test-overrides.js
      
      - name: Commit changes
        id: commit_changes
        if: steps.final_check.outputs.has_changes == 'true'
        run: |
          # Ensure package-lock.json is updated with any override changes
          npm install
          npm audit fix || true
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "has_committed_changes=false" >> "$GITHUB_OUTPUT"
            echo "No tracked dependency changes remain after override cleanup."
            exit 0
          fi
          git commit -m "chore(deps): security and dependency updates

          - Updated dependencies using ncu --target minor
          - Updated existing overrides to latest minor versions
          - Fixed all vulnerabilities (updated direct deps + added overrides as needed)
          - Removed unnecessary overrides where applicable
          - Updated package-lock.json
          
          Generated by security-updates workflow"
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "has_committed_changes=true" >> "$GITHUB_OUTPUT"

      - name: Stop if no tracked dependency changes remain
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'false'
        run: |
          echo "## No Dependency PR Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No tracked dependency changes remained after override cleanup; no commit or PR was created." >> "$GITHUB_STEP_SUMMARY"
      
      - name: Run code quality checks
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        run: |
          echo "Running code quality checks..."
          npm run code-quality-check
      
      - name: Run tests
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        run: |
          echo "Running tests..."
          npm run test
        # Preserve the existing policy; Jest failures do not block automatic merges.
        continue-on-error: true
      
      - name: Build application
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        run: |
          echo "Building application..."
          npm run build
      
      - name: Run security audit
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        run: |
          echo "Running security audit (all severity levels)..."
          npm audit --audit-level=low || echo "::warning::Some vulnerabilities remain after updates"
        continue-on-error: true
      
      - name: Generate change summary
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        run: |
          echo "Generating change summary..."
          echo "# Security and Dependency Update Summary" > pr_body.md
          echo "" >> pr_body.md
          echo "## 🔒 Automated Security & Dependency Updates" >> pr_body.md
          echo "" >> pr_body.md
          echo "This PR updates dependencies to their latest **minor versions** and addresses security vulnerabilities at all severity levels." >> pr_body.md
          echo "" >> pr_body.md
          echo "### Changes Made:" >> pr_body.md
          echo "- ✅ Updated dependencies to latest compatible minor versions" >> pr_body.md
          echo "- ✅ Fixed all vulnerabilities (updated direct deps + added overrides)" >> pr_body.md
          echo "- ✅ Removed unnecessary overrides (where all resolved versions meet requirements)" >> pr_body.md
          echo "- ✅ Updated \`package-lock.json\`" >> pr_body.md
          echo "- ✅ Ran linting and type-checking" >> pr_body.md
          echo "- Ran Jest tests (non-blocking; see workflow logs for results)" >> pr_body.md
          echo "- ✅ Built application successfully" >> pr_body.md
          echo "" >> pr_body.md
          echo "### Package Changes:" >> pr_body.md
          echo '```diff' >> pr_body.md
          git diff HEAD~1 package.json >> pr_body.md
          echo '```' >> pr_body.md
          echo "" >> pr_body.md
          echo "### Review Checklist:" >> pr_body.md
          echo "- [ ] Review version changes in \`package.json\`" >> pr_body.md
          echo "- [ ] Verify no breaking changes in release notes" >> pr_body.md
          echo "- [ ] Check that all tests pass" >> pr_body.md
          echo "- [ ] Confirm security audit results" >> pr_body.md
          echo "- [ ] Test locally if needed" >> pr_body.md
          echo "" >> pr_body.md
          echo "---" >> pr_body.md
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> pr_body.md
          echo "**Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> pr_body.md
      
      - name: Push branch
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        run: |
          git push origin ${{ env.branch_name }}
          echo "✓ Pushed branch: ${{ env.branch_name }}"
      
      - name: Create Pull Request
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_BODY=$(cat pr_body.md)
          PR_URL=$(gh pr create \
            --base develop \
            --head ${{ env.branch_name }} \
            --title "chore(deps): security and dependency updates" \
            --body "$PR_BODY")
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

          echo "## ✅ Pull Request Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A pull request has been created with the dependency updates." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ env.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Base:** \`develop\`" >> $GITHUB_STEP_SUMMARY

      - name: Wait for PR checks, then merge if green
        if: steps.final_check.outputs.has_changes == 'true' && steps.commit_changes.outputs.has_committed_changes == 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail

          if [ -z "${PR_URL:-}" ]; then
            echo "::error::PR_URL is empty; refusing to merge."
            exit 1
          fi

          if [ -z "${EXPECTED_HEAD_SHA:-}" ] || [[ "${EXPECTED_BRANCH:-}" != automated-security-updates-* ]]; then
            echo "::error::Expected dependency branch or commit is missing; refusing to merge."
            exit 1
          fi

          validate_dependency_pr() {
            local metadata
            metadata=$(gh pr view "$PR_URL" \
              --json number,url,state,baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,changedFiles,files)
            if ! printf '%s\n' "$metadata" | jq -e \
              --arg repo_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --arg branch "$EXPECTED_BRANCH" \
              --arg sha "$EXPECTED_HEAD_SHA" '
                .url == ($repo_url + "/pull/" + (.number | tostring)) and
                .state == "OPEN" and
                .baseRefName == "develop" and
                .headRefName == $branch and
                .headRefOid == $sha and
                .isCrossRepository == false and
                .isDraft == false and
                .changedFiles > 0 and .changedFiles <= 2 and
                (.files | length) == .changedFiles and
                all(.files[]; .path == "package.json" or .path == "package-lock.json")
              ' > /dev/null; then
              echo "::error::PR must target develop in this repository, contain only dependency files, and match the expected branch and commit."
              return 1
            fi
            PR_NUMBER=$(printf '%s\n' "$metadata" | jq -r '.number')
          }

          validate_dependency_pr

          # --watch waits for existing checks, not for their initial registration.
          for ATTEMPT in $(seq 1 20); do
            CHECK_OUTPUT=$(gh pr checks "$PR_URL" 2>&1) && CHECK_STATUS=0 || CHECK_STATUS=$?
            if [ "$CHECK_STATUS" -eq 1 ] && printf '%s' "$CHECK_OUTPUT" | grep -q '^no checks reported'; then
              if [ "$ATTEMPT" -eq 20 ]; then
                echo "::error::No PR checks registered within the polling limit; refusing to merge."
                exit 1
              fi
              echo "No PR checks registered yet; waiting 15s."
              sleep 15
            elif [ "$CHECK_STATUS" -eq 0 ] || [ "$CHECK_STATUS" -eq 8 ]; then
              break
            else
              printf '%s\n' "$CHECK_OUTPUT" >&2
              exit "$CHECK_STATUS"
            fi
          done

          gh pr checks "$PR_URL" --watch --fail-fast --interval 30

          # Recheck after waiting; the merge API also rejects a different head SHA.
          validate_dependency_pr

          # Submit using the App's PR-only bypass, without gh pr merge's local policy check.
          MERGE_RESPONSE=$(gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$EXPECTED_HEAD_SHA")
          if ! printf '%s\n' "$MERGE_RESPONSE" | jq -e '.merged == true' > /dev/null; then
            echo "::error::GitHub did not confirm a successful merge; leaving the branch intact."
            printf '%s\n' "$MERGE_RESPONSE" >&2
            exit 1
          fi
          echo "Merged: $PR_URL"

          BRANCH_REFS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$EXPECTED_BRANCH")
          BRANCH_SHA=$(printf '%s\n' "$BRANCH_REFS" | jq -r \
            --arg ref "refs/heads/$EXPECTED_BRANCH" '.[] | select(.ref == $ref) | .object.sha')
          if [ -z "$BRANCH_SHA" ]; then
            echo "Merged branch is already deleted."
          elif [ "$BRANCH_SHA" = "$EXPECTED_HEAD_SHA" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$EXPECTED_BRANCH"
          else
            echo "::warning::The branch changed after merging; leaving it intact."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_HEAD_SHA: ${{ steps.commit_changes.outputs.head_sha }}
          EXPECTED_BRANCH: ${{ env.branch_name }}

      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs-${{ github.run_number }}
          path: /home/runner/.npm/_logs/
          retention-days: 7
          if-no-files-found: warn
