---
name: Build release artifact and create github draft release

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      deploy-to-aws=dev:
        required: true
        description: Do you want this image to be deployed to the AWS dev environment? This will replace the current image on dev so this release image can be tested in the dev environment.
        type: boolean
        default: false

env:
  GITHUB_REGISTRY_PREFIX: ghcr.io
  GITHUB_REGISTRY_NAME: izgateway
  IMAGE_NAME: ${{ github.repository }}
  BUILD_ID: ${{ github.run_number}}
  BRANCH: ${{ github.ref_name }}

jobs:
  generate-release-timestamp:
    name: Generate release timestamp
    runs-on: ubuntu-latest
    outputs:
      releaseDate: ${{ steps.exposeValue.outputs.releaseDate }}
    steps:
      - name: Get current date
        id: date
        run: echo "RELEASE_DATE=$(date +'%d%b%Y%H%M%S')" >> "$GITHUB_ENV"
      - name: Expose value
        id: exposeValue
        run: |
          echo "::set-output name=releaseDate::${{ env.RELEASE_DATE }}"

  code-quality-check:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install Dependencies
        run: npm ci --force
      # - name: Run Jest Unit Tests
      #   run: npm run test
      - name: Lint
        run: npm run code-quality-check

  create-tag:
    name: Create tag
    runs-on: ubuntu-latest
    needs: [code-quality-check, generate-release-timestamp]
    steps:
      - name: Create tag
        uses: actions/github-script@v5
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/release-${{ needs.generate-release-timestamp.outputs.releaseDate }}',
              sha: context.sha
            })

  build-and-push-image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [code-quality-check, generate-release-timestamp, create-tag]
    outputs:
      releaseDate: ${{ steps.exposeValue.outputs.releaseDate }}
    permissions:
      contents: write
      packages: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to the GitHub Container registry
        id: login-ghcr
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.GITHUB_REGISTRY_PREFIX }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.GITHUB_REGISTRY_PREFIX }}/${{ env.GITHUB_REGISTRY_NAME }}/izg-configuration-console
          tags: |
            type=raw,value=${{ needs.generate-release-timestamp.outputs.releaseDate }}
            type=raw,value=release
          flavor: |
            latest=auto

      - name: Build and push Docker Config Console image
        id: docker_build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Expose value
        id: exposeValue
        run: |
          echo "::set-output name=releaseDate::${{ needs.generate-release-timestamp.outputs.releaseDate }}"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [generate-release-timestamp, build-and-push-image]
    steps:
      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{needs.build-and-push-image.outputs.releaseDate}}
          name: Release ${{needs.build-and-push-image.outputs.releaseDate}}
          body: |
            ## Info
            Commit ${{ github.sha }} was built as an artifact and saved to github io. [See code diff](${{ github.event.compare }}).
             It was initialized by [${{ github.event.sender.login }}](${{ github.event.sender.html_url }}).

            ## Artifact 
            ${{ env.GITHUB_REGISTRY_PREFIX }}/${{ env.GITHUB_REGISTRY_NAME }}/izg-configuration-console:${{needs.generate-release-timestamp.outputs.releaseDate}}

            ## How to publish?
            When ready to publish, edit this draft and press **"Publish release"**.
          draft: true
