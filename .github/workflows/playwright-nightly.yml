name: Playwright E2E Tests (Dev)

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday
    - cron: '0 7 * * 2'  # Tuesday
    - cron: '0 7 * * 3'  # Wednesday
    - cron: '0 7 * * 4'  # Thursday
    - cron: '0 7 * * 5'  # Friday
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      OKTA_USERNAME: ${{ secrets.OKTA_USERNAME }}
      OKTA_PASSWORD: ${{ secrets.OKTA_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      OKTA_NONADMIN_USERNAME: ${{ secrets.OKTA_NONADMIN_USERNAME }}
      OKTA_NONADMIN_PASSWORD: ${{ secrets.OKTA_NONADMIN_PASSWORD }}
      OKTA_NONADMIN_EXPECTED_FULLNAME: ${{ secrets.OKTA_NONADMIN_EXPECTED_FULLNAME }}
      OKTA_NONADMIN_EXPECTED_DEST_IDS: ${{ secrets.OKTA_NONADMIN_EXPECTED_DEST_IDS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1-node16
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Start AWS Dev Service
        run: |
          echo "Starting ECS service..."
          aws ecs update-service \
            --cluster izgateway-configuration-console \
            --service izgateway-config-console \
            --desired-count 1 \
            --enable-execute-command \
            --force-new-deployment \
            | jq ".service.deployments[].id"

      - name: Install dependencies
        run: npm ci --force

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (all browsers, no screenshots)
        run: npx playwright test --reporter=html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Shutdown AWS Dev Service
        if: github.event_name == 'schedule'
        run: |
          echo "Stopping ECS service..."
          aws ecs update-service \
            --cluster izgateway-configuration-console \
            --service izgateway-config-console \
            --desired-count 0 \
            --force-new-deployment \
            | jq ".service.deployments[].id"
