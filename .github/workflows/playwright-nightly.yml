name: Playwright E2E Tests (Dev)

on:
  schedule:
    - cron: '0 7 * * 1' # Monday
    - cron: '0 7 * * 2' # Tuesday
    - cron: '0 7 * * 3' # Wednesday
    - cron: '0 7 * * 4' # Thursday
    - cron: '0 7 * * 5' # Friday
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    # id-token: the RBAC report upload signs in to AWS with GitHub OIDC.
    permissions:
      contents: read
      id-token: write

    env:
      OKTA_USERNAME: ${{ secrets.OKTA_USERNAME }}
      OKTA_PASSWORD: ${{ secrets.OKTA_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      OKTA_NONADMIN_USERNAME: ${{ secrets.OKTA_NONADMIN_USERNAME }}
      OKTA_NONADMIN_PASSWORD: ${{ secrets.OKTA_NONADMIN_PASSWORD }}
      OKTA_NONADMIN_EXPECTED_FULLNAME: ${{ secrets.OKTA_NONADMIN_EXPECTED_FULLNAME }}
      OKTA_NONADMIN_EXPECTED_DEST_IDS: ${{ secrets.OKTA_NONADMIN_EXPECTED_DEST_IDS }}
      JIRA_API_URL: ${{ secrets.JIRA_API_URL }}
      JIRA_API_AUTH_BASE64: ${{ secrets.JIRA_API_AUTH_BASE64 }}
      DNS_VERIFY_BYPASS_AVAILABLE: ${{ vars.DNS_VERIFY_BYPASS_AVAILABLE }}
      E2E_RBAC_JURIS_OPS_USERNAME: ${{ secrets.E2E_RBAC_JURIS_OPS_USERNAME }}
      E2E_RBAC_JURIS_OPS_PASSWORD: ${{ secrets.E2E_RBAC_JURIS_OPS_PASSWORD }}
      E2E_RBAC_JURIS_OPS_FULLNAME: ${{ secrets.E2E_RBAC_JURIS_OPS_FULLNAME }}
      E2E_RBAC_NO_ROLE_USERNAME: ${{ secrets.E2E_RBAC_NO_ROLE_USERNAME }}
      E2E_RBAC_NO_ROLE_PASSWORD: ${{ secrets.E2E_RBAC_NO_ROLE_PASSWORD }}
      E2E_RBAC_NO_ROLE_FULLNAME: ${{ secrets.E2E_RBAC_NO_ROLE_FULLNAME }}
      # RBAC matrix check (e2e/rbac, IGDD-3621). IZG Operations and
      # Jurisdiction Operations reuse the accounts above; a role whose
      # secrets are unset is reported as CONFIG or PENDING, not run.
      # IZG Security and Jurisdiction Security are mapped ahead of time: their
      # columns stay PENDING until roles.ts marks them live.
      E2E_RBAC_IZG_SECURITY_USERNAME: ${{ secrets.E2E_RBAC_IZG_SECURITY_USERNAME }}
      E2E_RBAC_IZG_SECURITY_PASSWORD: ${{ secrets.E2E_RBAC_IZG_SECURITY_PASSWORD }}
      E2E_RBAC_JURIS_SECURITY_USERNAME: ${{ secrets.E2E_RBAC_JURIS_SECURITY_USERNAME }}
      E2E_RBAC_JURIS_SECURITY_PASSWORD: ${{ secrets.E2E_RBAC_JURIS_SECURITY_PASSWORD }}
      E2E_RBAC_IZG_PROGRAM_USERNAME: ${{ secrets.E2E_RBAC_IZG_PROGRAM_USERNAME }}
      E2E_RBAC_IZG_PROGRAM_PASSWORD: ${{ secrets.E2E_RBAC_IZG_PROGRAM_PASSWORD }}
      E2E_RBAC_IZG_SUPPORT_USERNAME: ${{ secrets.E2E_RBAC_IZG_SUPPORT_USERNAME }}
      E2E_RBAC_IZG_SUPPORT_PASSWORD: ${{ secrets.E2E_RBAC_IZG_SUPPORT_PASSWORD }}
      E2E_RBAC_JURIS_SUPPORT_USERNAME: ${{ secrets.E2E_RBAC_JURIS_SUPPORT_USERNAME }}
      E2E_RBAC_JURIS_SUPPORT_PASSWORD: ${{ secrets.E2E_RBAC_JURIS_SUPPORT_PASSWORD }}
      E2E_RBAC_FOREIGN_DEST: ${{ vars.E2E_RBAC_FOREIGN_DEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Start IZG Hub and IZG CC in AWS Dev
        env:
          AWS_REGIONS: ${{ vars.AWS_REGIONS }}
          ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}
        run: |
          if [ -z "$AWS_REGIONS" ]; then
            echo "AWS_REGIONS not set, defaulting to us-east-1"
            AWS_REGIONS="us-east-1"
          fi

          if [ -z "$ECS_DESIRED_COUNT" ]; then
            echo "ECS_DESIRED_COUNT not set, defaulting to 1"
            ECS_DESIRED_COUNT="1"
          fi

          for region in $AWS_REGIONS; do
            echo "Start IZG Hub in $region (starting $ECS_DESIRED_COUNT containers)"
            aws ecs update-service --region $region --cluster izgateway-dev-izgateway-services --service izgateway-devalb-service --force-new-deployment --enable-execute-command --desired-count $ECS_DESIRED_COUNT | jq ".service.deployments[].id" &
          done

          for region in $AWS_REGIONS; do
            echo "Wait for IZG Hub service stability in $region"
            aws ecs wait services-stable --region $region --cluster izgateway-dev-izgateway-services --service izgateway-devalb-service &
          done

          for region in $AWS_REGIONS; do
            echo "Start IZG CC in $region (starting $ECS_DESIRED_COUNT containers)"
            aws ecs update-service --region $region --cluster izgateway-configuration-console --service izgateway-config-console --force-new-deployment --enable-execute-command --desired-count $ECS_DESIRED_COUNT | jq ".service.deployments[].id" &
          done

          wait

          for region in $AWS_REGIONS; do
            echo "Wait for IZG CC service stability in $region"
            aws ecs wait services-stable --region $region --cluster izgateway-configuration-console --service izgateway-config-console &
          done

          wait
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Configuring npm authentication for GitHub Packages..."
          npm config set @izgateway:registry https://npm.pkg.github.com/
          npm config set //npm.pkg.github.com/:_authToken ${NPM_TOKEN}
          echo "✓ npm authentication configured"
      - name: Install dependencies
        run: npm ci --force

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (all browsers, no screenshots)
        run: npx playwright test --reporter=html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 1

      # Report only (IGDD-3621): runs even if the suite above failed, and a
      # finding here never fails the workflow.
      - name: Verify RBAC matrix (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run test:rbac

      # The RBAC report is uploaded at the end of the job, after AWS Dev is
      # stopped: see the last two steps.

      # always(): stop dev even when a test step above failed or was cancelled.
      - name: Stop IZG Hub and IZG CC in AWS Dev
        if: always()
        env:
          AWS_REGIONS: ${{ vars.AWS_REGIONS }}
          ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}
        run: |
          if [ -z "$AWS_REGIONS" ]; then
            echo "AWS_REGIONS not set, defaulting to us-east-1"
            AWS_REGIONS="us-east-1"
          fi

          if [ -z "$ECS_DESIRED_COUNT" ]; then
            echo "ECS_DESIRED_COUNT not set, defaulting to 1"
            ECS_DESIRED_COUNT="1"
          fi

          # Every stop is attempted, in parallel; the step fails if any failed.
          # pipefail: without it an aws error is hidden behind jq's success.
          # A bare `wait` returns 0 whatever the jobs returned, so each one is
          # waited for by its PID.
          set -o pipefail
          pids=()
          for region in $AWS_REGIONS; do
            echo "Stopping IZG Hub in $region"
            aws ecs update-service --region $region --cluster izgateway-dev-izgateway-services --service izgateway-devalb-service --force-new-deployment --enable-execute-command --desired-count 0 | jq ".service.deployments[].id" &
            pids+=($!)

            echo "Stopping IZG CC in $region"
            aws ecs update-service --region $region --cluster izgateway-configuration-console --service izgateway-config-console --force-new-deployment --enable-execute-command --desired-count 0 | jq ".service.deployments[].id" &
            pids+=($!)
          done

          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one ECS service did not accept the stop; dev may still be running"
            exit 1
          fi

      # RBAC report (IGDD-3621) goes to a private S3 bucket, never to a GitHub
      # artifact: this repo is public, and the report lists unenforced access.
      # GitHub gets only the counts in the job summary.
      #
      # Last on purpose: signing in with the OIDC role replaces the AWS
      # credentials above for every later step, and the role can do nothing
      # but upload reports. It trusts the develop branch only (scheduled runs),
      # so runs of other branches skip the upload. The role and bucket come
      # from iz-gateway-terraform (hub/console/rbac-report-bucket.tf).
      # Both steps are continue-on-error: a broken role or upload must not
      # fail a report-only check.
      - name: Sign in to AWS for the RBAC report
        id: rbac-aws
        if: ${{ !cancelled() && vars.RBAC_REPORT_ROLE_ARN != '' && github.ref == 'refs/heads/develop' && hashFiles('rbac-report/rbac-report.json') != '' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RBAC_REPORT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload RBAC report
        if: ${{ !cancelled() && hashFiles('rbac-report/rbac-report.json') != '' }}
        continue-on-error: true
        env:
          SIGNED_IN: ${{ steps.rbac-aws.outcome }}
          RBAC_REPORT_BUCKET: ${{ vars.RBAC_REPORT_BUCKET }}
        run: |
          if [ "$SIGNED_IN" != "success" ] || [ -z "$RBAC_REPORT_BUCKET" ]; then
            echo "::notice::RBAC report not uploaded: it is uploaded from develop once RBAC_REPORT_ROLE_ARN and RBAC_REPORT_BUCKET are set"
            exit 0
          fi
          folder="rbac-reports/$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Create only: the role may only upload with If-None-Match: *, so a
          # run can never replace an earlier report. `aws s3 cp` cannot send
          # that header, hence one put-object per file.
          for file in rbac-report/*; do
            case "$file" in
              *.html) type="text/html" ;;
              *.json) type="application/json" ;;
              *) type="text/markdown" ;;
            esac
            aws s3api put-object --bucket "$RBAC_REPORT_BUCKET" --key "${folder}/$(basename "$file")" \
              --body "$file" --content-type "$type" --if-none-match '*' > /dev/null
          done
          echo "Full report: \`${folder}/\` in the RBAC report bucket." >> "$GITHUB_STEP_SUMMARY"
