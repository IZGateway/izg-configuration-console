name: Playwright E2E Tests (Dev)

on:
  schedule:
    - cron: '0 7 * * 1' # Monday
    - cron: '0 7 * * 2' # Tuesday
    - cron: '0 7 * * 3' # Wednesday
    - cron: '0 7 * * 4' # Thursday
    - cron: '0 7 * * 5' # Friday
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      OKTA_USERNAME: ${{ secrets.OKTA_USERNAME }}
      OKTA_PASSWORD: ${{ secrets.OKTA_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      OKTA_NONADMIN_USERNAME: ${{ secrets.OKTA_NONADMIN_USERNAME }}
      OKTA_NONADMIN_PASSWORD: ${{ secrets.OKTA_NONADMIN_PASSWORD }}
      OKTA_NONADMIN_EXPECTED_FULLNAME: ${{ secrets.OKTA_NONADMIN_EXPECTED_FULLNAME }}
      OKTA_NONADMIN_EXPECTED_DEST_IDS: ${{ secrets.OKTA_NONADMIN_EXPECTED_DEST_IDS }}
      JIRA_API_URL: ${{ secrets.JIRA_API_URL }}
      JIRA_API_AUTH_BASE64: ${{ secrets.JIRA_API_AUTH_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Start IZG Hub and IZG CC in AWS Dev
        env:
          AWS_REGIONS: ${{ vars.AWS_REGIONS }}
          ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}
        run: |
          if [ -z "$AWS_REGIONS" ]; then
            echo "AWS_REGIONS not set, defaulting to us-east-1"
            AWS_REGIONS="us-east-1"
          fi

          if [ -z "$ECS_DESIRED_COUNT" ]; then
            echo "ECS_DESIRED_COUNT not set, defaulting to 1"
            ECS_DESIRED_COUNT="1"
          fi

          for region in $AWS_REGIONS; do
            echo "Start IZG Hub in $region (starting $ECS_DESIRED_COUNT containers)"
            aws ecs update-service --region $region --cluster izgateway-dev-izgateway-services --service izgateway-devalb-service --force-new-deployment --enable-execute-command --desired-count $ECS_DESIRED_COUNT | jq ".service.deployments[].id" &
          done

          for region in $AWS_REGIONS; do
            echo "Wait for IZG Hub service stability in $region"
            aws ecs wait services-stable --region $region --cluster izgateway-dev-izgateway-services --service izgateway-devalb-service &
          done

          for region in $AWS_REGIONS; do
            echo "Start IZG CC in $region (starting $ECS_DESIRED_COUNT containers)"
            aws ecs update-service --region $region --cluster izgateway-configuration-console --service izgateway-config-console --force-new-deployment --enable-execute-command --desired-count $ECS_DESIRED_COUNT | jq ".service.deployments[].id" &
          done

          wait

          for region in $AWS_REGIONS; do
            echo "Wait for IZG CC service stability in $region"
            aws ecs wait services-stable --region $region --cluster izgateway-configuration-console --service izgateway-config-console &
          done

          wait
      - name: Install dependencies
        run: npm ci --force

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (all browsers, no screenshots)
        run: npx playwright test --reporter=html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Stop IZG Hub and IZG CC in AWS Dev
        env:
          AWS_REGIONS: ${{ vars.AWS_REGIONS }}
          ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}
        run: |
          if [ -z "$AWS_REGIONS" ]; then
            echo "AWS_REGIONS not set, defaulting to us-east-1"
            AWS_REGIONS="us-east-1"
          fi

          if [ -z "$ECS_DESIRED_COUNT" ]; then
            echo "ECS_DESIRED_COUNT not set, defaulting to 1"
            ECS_DESIRED_COUNT="1"
          fi

          for region in $AWS_REGIONS; do
            echo "Stopping IZG Hub in $region
            aws ecs update-service --region $region --cluster izgateway-dev-izgateway-services --service izgateway-devalb-service --force-new-deployment --enable-execute-command --desired-count 0 | jq ".service.deployments[].id" &

            echo "Stopping IZG CC in $region
            aws ecs update-service --region $region --cluster izgateway-configuration-console --service izgateway-config-console --force-new-deployment --enable-execute-command --desired-count 0 | jq ".service.deployments[].id" &
          done
