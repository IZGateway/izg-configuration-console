name: Playwright E2E Tests (Dev)

on:
  push:
    branches:
      - IGDD-2081-playwright-in-pipeline
  workflow_dispatch:

jobs:
  e2e:
    if: github.ref == 'refs/heads/IGDD-2081-playwright-in-pipeline'
    runs-on: ubuntu-latest

    env:
      OKTA_USERNAME: ${{ secrets.OKTA_USERNAME }}
      OKTA_PASSWORD: ${{ secrets.OKTA_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci --force

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (all browsers, no screenshots)
        run: npx playwright test --reporter=html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
