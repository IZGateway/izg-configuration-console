name: NCU Minor Dependency Updates

on:
  schedule:
    # Run daily at 3 AM UTC (avoids conflict with E2E tests at 7 AM and security updates at 9 AM)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Install npm-check-updates
        run: npm install -g npm-check-updates
      
      - name: Run ncu and check for updates
        id: ncu_check
        run: |
          echo "Running npm-check-updates with --target minor..."
          ncu --target minor -u > ncu_output.txt 2>&1 || true
          cat ncu_output.txt
          
          if git diff --quiet package.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No minor dependency updates available"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✓ Minor dependency updates found"
          fi
      
      - name: Stop if no changes
        if: steps.ncu_check.outputs.has_changes == 'false'
        run: |
          echo "## No Dependency Updates Available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All dependencies are up-to-date within minor version constraints." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next check:** Next scheduled run or manual trigger" >> $GITHUB_STEP_SUMMARY
          exit 0
      
      - name: Create update branch
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="automated-ncu-minor-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "✓ Created branch: $BRANCH_NAME"
      
      - name: Install updated dependencies
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Installing updated dependencies..."
          npm install --legacy-peer-deps
      
      - name: Test override removal
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Testing if overrides can be removed..."
          node scripts/test-overrides.js
      
      - name: Commit changes
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          git add package.json package-lock.json
          git commit -m "chore(deps): update dependencies (minor versions only)

          - Updated dependencies using ncu --target minor
          - Removed unnecessary overrides where applicable
          - Updated package-lock.json
          
          Generated by automated-ncu-minor-update workflow"
      
      - name: Run linting
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Running linting..."
          npm run lint || echo "::warning::Linting found issues"
        continue-on-error: true
      
      - name: Run type checking
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Running type checking..."
          npm run type-check
      
      - name: Run tests
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Running tests..."
          npm run test
        continue-on-error: true
      
      - name: Build application
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Building application..."
          npm run build
      
      - name: Run security audit
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Running security audit..."
          npm audit --audit-level=high || echo "::warning::Some vulnerabilities remain after updates"
        continue-on-error: true
      
      - name: Generate change summary
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          echo "Generating change summary..."
          echo "# Dependency Update Summary" > pr_body.md
          echo "" >> pr_body.md
          echo "## 🤖 Automated Minor Version Updates" >> pr_body.md
          echo "" >> pr_body.md
          echo "This PR updates dependencies to their latest **minor versions** using \`ncu --target minor -u\`." >> pr_body.md
          echo "" >> pr_body.md
          echo "### Changes Made:" >> pr_body.md
          echo "- ✅ Updated dependencies to latest compatible minor versions" >> pr_body.md
          echo "- ✅ Removed unnecessary overrides (where all resolved versions meet requirements)" >> pr_body.md
          echo "- ✅ Updated \`package-lock.json\`" >> pr_body.md
          echo "- ✅ Ran linting, type-checking, and tests" >> pr_body.md
          echo "- ✅ Built application successfully" >> pr_body.md
          echo "" >> pr_body.md
          echo "### Package Changes:" >> pr_body.md
          echo '```diff' >> pr_body.md
          git diff HEAD~1 package.json >> pr_body.md
          echo '```' >> pr_body.md
          echo "" >> pr_body.md
          echo "### Review Checklist:" >> pr_body.md
          echo "- [ ] Review version changes in \`package.json\`" >> pr_body.md
          echo "- [ ] Verify no breaking changes in release notes" >> pr_body.md
          echo "- [ ] Check that all tests pass" >> pr_body.md
          echo "- [ ] Confirm security audit results" >> pr_body.md
          echo "- [ ] Test locally if needed" >> pr_body.md
          echo "" >> pr_body.md
          echo "---" >> pr_body.md
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> pr_body.md
          echo "**Workflow Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> pr_body.md
      
      - name: Push branch
        if: steps.ncu_check.outputs.has_changes == 'true'
        run: |
          git push origin ${{ env.branch_name }}
          echo "✓ Pushed branch: ${{ env.branch_name }}"
      
      - name: Create Pull Request
        if: steps.ncu_check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY=$(cat pr_body.md)
          gh pr create \
            --base develop \
            --head ${{ env.branch_name }} \
            --title "chore(deps): automated minor dependency updates" \
            --body "$PR_BODY" \
            --label "dependencies,automated,minor-updates"
          
          echo "## ✅ Pull Request Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A pull request has been created with the dependency updates." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ env.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Base:** \`develop\`" >> $GITHUB_STEP_SUMMARY
