---
name: Continuous Deployment

on:
  push:
    branches:
      - main
      - production
  pull_request:

env:
  GITHUB_REGISTRY_PREFIX: ghcr.io
  GITHUB_REGISTRY_NAME: izgateway
  API_IMAGE_NAME: ${{ github.repository }}-api
  UI_IMAGE_NAME: ${{ github.repository }}-ui
  BUILD_ID: ${{github.run_number}}

jobs:
  code-quality-check:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16.x"
      - name: 📥 Monorepo install
        uses: ./.github/actions/yarn-nm-install
        with:
          cache-node-modules: true
      - name: Run UI Jest Tests
        run: yarn workspace @monorepo/ui test
      #   - name: Run API Jest Tests
      #     run: yarn workspace @monorepo/api test
      - name: Lint
        run: yarn lint

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [code-quality-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Deploy to Staging
        run: echo "Deploy to STAGING code here"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [code-quality-check]
    if: github.ref == 'refs/heads/production'
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Deploy to Prod
        run: echo "Deploy to PRODUCTION code here"
